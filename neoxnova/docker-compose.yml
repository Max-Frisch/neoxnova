version: "3.8"

services:
  # --- PostgreSQL Database Service ---
  postgres_db:
    image: postgres:16-alpine
    container_name: neoxnova_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: neoxnova
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- Redis Event Wheel Service ---
  redis_cache:
    image: redis:7-alpine
    container_name: neoxnova_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
